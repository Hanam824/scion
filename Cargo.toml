[workspace]
resolver = "2"
members = ["crates/*", "tests/e2e"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
hex = "0.4"
similar = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3"
clap = { version = "4", features = ["derive", "env"] }

scion-core = { path = "crates/scion-core" }
scion-store = { path = "crates/scion-store" }
scion-repo = { path = "crates/scion-repo" }
scion-proto = { path = "crates/scion-proto" }
scion-server = { path = "crates/scion-server" }
scn = { path = "crates/scn" }
scion-import = { path = "crates/scion-import" }

[profile.release]
strip = true
